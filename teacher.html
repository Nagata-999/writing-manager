<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher | Writing Manager</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><div><strong>Writing Manager</strong><span>Teacher Dashboard</span></div><a href="index.html">Student</a></header><main class="wrap"><section id="loginCard" class="card"><p class="eyebrow">TEACHER LOGIN</p><h1>先生ログイン</h1><form id="loginForm"><label>Email<input id="loginEmail" type="email" autocomplete="username" required></label><label>Password<input id="loginPassword" type="password" autocomplete="current-password" required></label><button id="loginBtn" type="submit">ログイン</button><p id="loginMessage" class="message"></p></form></section><section id="dashboard" class="card hidden"><div class="row"><div><p class="eyebrow">TEACHER DASHBOARD</p><h1>作文管理</h1></div><div><span id="teacherEmail"></span> <button class="secondary" id="logout">ログアウト</button></div></div><div class="toolbar"><select id="assignmentFilter"><option value="">全課題</option></select><input id="classFilter" placeholder="クラス (例 2-M)"><select id="statusFilter"><option value="">全状態</option><option value="submitted">未添削</option><option value="reviewed">添削済</option><option value="returned">返却済</option></select><button id="reload">更新</button></div><div class="stats"><div class="stat">提出<b id="total">0</b></div><div class="stat">未添削<b id="pending">0</b></div><div class="stat">添削済<b id="reviewed">0</b></div><div class="stat">返却済<b id="returned">0</b></div></div><div class="tablewrap"><table><thead><tr><th>課題</th><th>クラス</th><th>番号</th><th>氏名</th><th>Words</th><th>状態</th><th>提出日時</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><div id="modal" class="modal hidden"><div class="modalbox"><div class="row"><h2 id="studentTitle"></h2><button class="secondary" id="close">閉じる</button></div><p id="meta"></p><div id="essayView" class="essayview"></div><h3>評価</h3><div class="rubric"><label>Content<input id="contentScore" type="number" min="0" max="9"></label><label>Organization<input id="organizationScore" type="number" min="0" max="9"></label><label>Vocabulary<input id="vocabularyScore" type="number" min="0" max="9"></label><label>Grammar<input id="grammarScore" type="number" min="0" max="9"></label></div><label>コメント<textarea id="feedback" rows="6"></textarea></label><div class="row"><span id="saveMessage"></span><div><button class="secondary" id="saveReview">添削を保存</button> <button id="returnReview">返却済みにする</button></div></div></div></div><script src="config.js"></script><script src="teacher.js"></script></body></html>
