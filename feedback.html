<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feedback | Writing Manager</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><div><strong>Writing Manager</strong><span>My Writing Portfolio</span></div><a href="index.html">作文を提出</a></header><main class="wrap"><section class="card"><p class="eyebrow">MY FEEDBACK</p><h1>フィードバックを見る</h1><p>クラス・出席番号・本人確認コードを入力してください。</p><form id="feedbackLogin"><div class="grid3"><label>クラス<input id="fbClass" required placeholder="2-M"></label><label>出席番号<input id="fbNo" required type="number" min="1"></label><label>本人確認コード<input id="fbCode" required type="password" minlength="4"></label></div><button type="submit">過去の作文を見る</button><p id="fbMessage" class="message"></p></form></section><section id="portfolio" class="hidden"><div class="row"><h2>Writing Portfolio</h2><span id="portfolioCount"></span></div><div id="feedbackList"></div></section></main><script src="config.js"></script><script src="feedback.js"></script></body></html>
